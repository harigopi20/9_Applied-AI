# Runs the automated test suite (app/tests.html) on every pull request into
# main, on every push to main and on demand. The result file is shown in the
# run summary and kept as a downloadable artifact (90 days).
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --prefix tools --no-audit --no-fund
          npx --prefix tools playwright install --with-deps chromium

      - name: Run app/tests.html
        run: node tools/run_tests.js --out test-results

      - name: Write result to the run summary
        if: always()
        run: cat test-results/*.md >> "$GITHUB_STEP_SUMMARY" || echo "No result file written." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 90
